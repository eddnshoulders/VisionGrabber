<?xml version="1.0" encoding="UTF-8"?>
<svg width="210mm" height="148mm" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cylinder top hazard stickers - print sheet</title>
<desc>Three hazard stickers at 18mm diameter: death (red, skull), danger (orange, flame), warning (yellow, exclamation mark). Black icons on coloured circles.</desc>

<style>
  .cut { stroke: #aaa; stroke-width: 0.5; stroke-dasharray: 3,3; fill: none; }
  .label { font-family: sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
</style>

<text x="340" y="28" class="label" style="font-size:14px;fill:#222;font-weight:500">Cylinder top hazard stickers — print at 100%, cut on dashed guides</text>
<text x="340" y="46" class="label">Each sticker 18mm diameter. Print on white label stock or plain paper and laminate.</text>

<!-- ROW 1: DEATH (red, black skull) -->
